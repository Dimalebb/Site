{% extends "labs/base.html" %}

{% block content %}

<div class="auth-container">

    <h2 class="auth-title">
        Новий пароль
    </h2>

    <form method="post" class="auth-form">

        {% csrf_token %}

        <input type="password"
               name="password"
               placeholder="Новий пароль"
               required>

        <button type="submit" class="auth-btn">
            Змінити пароль
        </button>

    </form>

</div>

{% endblock %}
