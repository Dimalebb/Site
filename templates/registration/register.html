{% extends "labs/base.html" %}

{% block content %}
<div class="auth-container">

    <h2>Реєстрація</h2>

    <form method="post">

        {% csrf_token %}

        <input type="text"
               name="username"
               placeholder="Username"
               autocomplete="off"
               required>

        <input type="email"
               name="email"
               placeholder="Email"
               autocomplete="off"
               required>

        <input type="password"
               name="password1"
               placeholder="Пароль"
               autocomplete="new-password"
               required>

        <input type="password"
               name="password2"
               placeholder="Повторіть пароль"
               autocomplete="new-password"
               required>

        <button type="submit">
            Зареєструватися
        </button>

    </form>
{% if form.errors %}

    <div>

        {{ form.errors }}

    </div>

{% endif %}
</div>
{% endblock %}
