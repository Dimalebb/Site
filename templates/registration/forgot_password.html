{% extends "labs/base.html" %}

{% block content %}

<div class="auth-container">

    <h2 class="auth-title">
        Відновлення пароля
    </h2>

    {% if error %}
        <div class="auth-error">
            {{ error }}
        </div>
    {% endif %}

    <form method="post" class="auth-form">

        {% csrf_token %}

        <input type="email"
               name="email"
               placeholder="Ваш Email"
               required>

        <button type="submit" class="auth-btn">
            Надіслати код
        </button>

    </form>

</div>

{% endblock %}
